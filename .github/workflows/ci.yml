name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run flake8
        run: flake8 .

      - name: Check isort
        run: isort --check-only app tests run.py

      - name: Check black
        run: black --check app tests run.py

      - name: Run mypy
        run: mypy app tests

      - name: Run pytest
        run: pytest -v